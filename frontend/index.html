<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Evangelismo Prático - Pr. Roberto Casas. Descubra a certeza da vida eterna e compartilhe o evangelho de forma eficaz com um método comprovado." />
    <title>Evangelismo Prático | Pr. Roberto Casas</title>

    <!-- PWA & Mobile Icons -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#001869" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Evangelismo" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- FontAwesome for cross icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Recuperação Automática de Cache Antigo do Navegador -->
    <script>
      window.addEventListener('error', function(e) {
        var isAsset = e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK');
        if (isAsset) {
          console.warn('[PWA] Cache desatualizado detectado. Limpando Service Worker e recarregando a versão mais recente...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) { caches.delete(names[i]); }
            });
          }
          if (!sessionStorage.getItem('pwa_auto_refreshed')) {
            sessionStorage.setItem('pwa_auto_refreshed', 'true');
            window.location.reload();
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-body transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration com auto-update -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              console.log('PWA Service Worker registrado:', reg.scope);
              reg.update();
            })
            .catch((err) => console.log('Falha ao registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
